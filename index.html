<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트 Her — 구조와 기술</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --bg:#f7f6f4; --surface:#ffffff; --line:#d9d5cf;
  --tx:#26241f; --tx2:#5c574f; --tx3:#8d8880;
  --done:#5f9068; --wip:#c08a3e; --todo:#9a948c; --chip:#f0eeea; --hud:#3d3a34;
  --t0:#34302b; --t0tx:#faf7f2; --t0ring:#b9b1a4; --t1:#e9f0eb; --t2:#ffffff;
}
:root[data-theme="dark"]{
  --bg:#191816; --surface:#232120; --line:#3b3835;
  --tx:#f5f2ec; --tx2:#d2ccc2; --tx3:#aaa39a;
  --done:#8fbe97; --wip:#e6b268; --todo:#9b968f; --chip:#2c2a28; --hud:#b8b1a8;
  --t0:#55504a; --t0tx:#f6f2ec; --t0ring:#9c948a; --t1:#28302b; --t2:#232120;
}
*{box-sizing:border-box;margin:0}
body,.btn,.lg,.ln,#crumb,#hint,#panel,#pm,#pd,.chip,.mrow,#tld,#tlc,.dt{
  transition:background-color .42s ease,color .42s ease,border-color .42s ease}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.hud{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top{top:16px;left:20px;right:20px;justify-content:space-between}
#ttl{font-size:15px;font-weight:500;letter-spacing:-.01em}
#crumb{font-size:12.5px;color:var(--hud);margin-top:3px}
.btn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--tx2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.on{border-color:var(--tx2);color:var(--tx)}
#legend{bottom:16px;left:20px;gap:11px;max-width:calc(100% - 260px)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hud)}
.ln{width:18px;height:0;border-top:2px solid var(--hud);display:inline-block;flex:none}
.dt{width:10px;height:10px;border-radius:50%;border:2px solid;background:var(--surface);flex:none}
#hint{bottom:16px;right:20px;font-size:11.5px;color:var(--hud);text-align:right;max-width:220px;line-height:1.5}
#panel{position:absolute;top:78px;right:20px;width:308px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
#panel.on{opacity:1;transform:none}
#pt{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
#pm{font-size:11px;color:var(--tx3);margin:5px 0 8px}
#pd{font-size:12.5px;color:var(--tx2);line-height:1.65}
#pc{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mrow{width:100%;font-size:11.5px;color:var(--tx2);margin-bottom:6px;line-height:1.5}
.mrow b{font-weight:500;color:var(--tx3);margin-right:5px}
.mrow.trap{color:var(--wip)}
.mrow.trap b{color:var(--wip);opacity:.8}
.chip{font-size:10.5px;color:var(--tx2);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
#splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:13vh;text-align:center;opacity:0;pointer-events:auto;cursor:pointer;z-index:5}
#splash h1{font-size:42px;font-weight:500;letter-spacing:.08em;color:var(--tx);margin:0}
#splash p{font-size:14px;color:var(--hud);margin-top:12px;letter-spacing:.02em}
#splash small{display:block;font-size:11.5px;color:var(--hud);margin-top:26px}
#splash h1,#splash p,#splash small{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
#splash.in h1{opacity:1;transform:none}
#splash.in p{opacity:1;transform:none;transition-delay:.4s}
#splash.in small{opacity:.6;transform:none;transition-delay:1s}
.boot .hud,.boot #panel{opacity:0 !important;pointer-events:none !important}
.touring #hint,.touring #legend,.touring #panel{opacity:0 !important;pointer-events:none !important}
@media (min-width:641px){
  .touring #cap{left:20px;top:78px;bottom:auto;width:300px;max-height:calc(100% - 96px);overflow:auto;padding:16px 18px 14px;transform:translateX(-14px)}
  .touring #cap.on{transform:none}
  .touring #capc{flex-wrap:wrap;gap:8px}
  .touring #capd{flex:1 1 100%;margin-bottom:2px}
  .touring #capx{margin-left:auto}
}
#capm{margin-top:10px;display:none}
#capm .chip{display:inline-block;margin:2px 3px 0 0}
#capl{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:9px}
.touring #capm,.touring #capl{display:block}
.ci{font-size:12.5px;color:var(--tx3);padding:5px 8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:8px;line-height:1.4;transition:background .2s,color .2s}
.ci i{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.ci.done{color:var(--tx2)}.ci.done i{background:var(--tx3)}
.ci.on{color:var(--tx);background:var(--chip)}.ci.on i{background:var(--tx)}
.ci:hover{color:var(--tx)}
#cap{position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);width:min(720px,calc(100% - 40px));
  padding:14px 18px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  opacity:0;pointer-events:none;transition:opacity .32s ease,transform .32s ease;z-index:4}
#cap.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#capt{font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:8px}
#capt b{font-weight:500;color:var(--tx2)}
#capb{font-size:15px;line-height:1.62;color:var(--tx);margin-top:5px;min-height:24px}
#capb.sw{animation:capin .34s ease}
@keyframes capin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#capc{display:flex;align-items:center;gap:10px;margin-top:10px}
#capd{display:flex;gap:6px;align-items:center;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s,transform .2s}
.dot.on{background:var(--tx);transform:scale(1.25)}
.dot.done{background:var(--tx3)}
.cb{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap}
.cb:hover{color:var(--tx);border-color:var(--tx3)}
.cb.p{color:var(--tx);border-color:var(--tx2)}
@media (max-width:640px){
  #splash h1{font-size:30px}
  #splash{padding-bottom:17vh}
  #capm,#capl{display:none !important}
  #cap{bottom:62px;padding:11px 13px 9px;width:calc(100% - 24px)}
  #capb{font-size:13.5px;line-height:1.55}
  .cb{font-size:11px;padding:3px 8px}
  #top{top:10px;left:12px;right:12px}
  #ttl{font-size:14px}
  #crumb{font-size:11px;line-height:1.45}
  .btn{font-size:11px;padding:4px 8px}
  #hint{display:none}
  #legend{left:12px;right:12px;bottom:12px;max-width:none;gap:8px}
  .lg{font-size:11px;gap:4px}
  #allb,#spinb{display:none}
  #tlbar{bottom:58px;left:12px;right:12px;gap:7px}
  #tld,#tlc{font-size:11px}
  #panel{top:auto;bottom:84px;left:12px;right:12px;width:auto;max-height:38vh;overflow:auto}
}
</style>
</head>
<body>
<div id="stage" class="boot">
  <canvas id="cv"></canvas>
  <div class="hud" id="top">
    <div>
      <div id="ttl">프로젝트 Her — 구조와 기술</div>
      <div id="crumb">큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠/핀치로 확대</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="playb">투어</button>
      <span style="width:1px;height:18px;background:var(--line);align-self:center"></span>
      <button class="btn on" id="techb">기술</button>
      <button class="btn" id="numb">숫자</button>
      <button class="btn" id="trapb">함정</button>
      <span style="width:1px;height:18px;background:var(--line);align-self:center"></span>
      <button class="btn" id="timeb">시간</button>
      <button class="btn" id="allb">전체 펼치기</button>
      <button class="btn" id="spinb">회전 멈춤</button>
      <button class="btn" id="themeb">어둡게</button>
      <button class="btn" id="resetb">처음으로</button>
    </div>
  </div>
  <div class="hud" id="legend">
    <span id="plg" style="display:flex;gap:11px;flex-wrap:wrap;align-items:center"></span>
    <span style="width:1px;height:16px;background:var(--line);margin:0 4px"></span>
    <span class="lg" style="opacity:.72">테두리</span>
    <span class="lg"><i class="ln"></i>완성</span>
    <span class="lg"><i class="ln" style="opacity:.72"></i>진행 중</span>
    <span class="lg"><i class="ln" style="opacity:.44"></i>미착수</span>
  </div>
  <div class="hud" id="tlbar" style="display:none;left:20px;right:20px;bottom:54px;gap:10px;align-items:center">
    <span id="tld" style="font-size:12px;color:var(--hud);min-width:92px;white-space:nowrap"></span>
    <input id="tlr" type="range" min="0" max="59" value="59" style="flex:1;accent-color:var(--tx2);min-width:120px">
    <span id="tlc" style="font-size:11.5px;color:var(--hud);opacity:.85;white-space:nowrap"></span>
  </div>
  <div class="hud" id="hint">점선 = 부품이 건너가는 길<br>전부 RTX 4080 로컬 · API 비용 0</div>
  <div id="splash"><h1>프로젝트 Her</h1><p>같은 시간·공간·몸·일을 공유하는 AI — 조각들이 어떻게 하나가 되는지</p><small>클릭하면 건너뛴다</small></div>
  <div id="cap">
    <div id="capt"><b id="capn"></b><span id="caps"></span></div>
    <div id="capb"></div>
    <div id="capm"></div>
    <div id="capl"></div>
    <div id="capc">
      <div id="capd"></div>
      <button class="cb" id="capprev" title="이전 (←)">◀</button>
      <button class="cb" id="cappp" title="일시정지 (space)">⏸</button>
      <button class="cb" id="capnext" title="다음 (→)">▶</button>
      <button class="cb" id="capx" title="닫기 (Esc)">직접 둘러보기</button>
    </div>
  </div>
  <div id="panel"><div id="pt"></div><div id="pm"></div><div id="pd"></div><div id="pc"></div></div>
</div>
<script>
(function(){
var ST={done:'완성',wip:'진행 중',todo:'미착수'};
var ring=[
 {label:'눈',sub:'AI_EYE',st:'wip',
  tech:['Python','OpenCV','ONVIF','Ollama','Qwen2.5-VL'],
  d:'채팅으로는 시간축 있는 피드백을 못 준다. 그래서 눈을 준다. 카메라로 지금을 같이 본다.',
  sat:[['RTSP 연결','done','카메라 영상을 실시간으로 받는다. 샤오미 홈캠은 클라우드 잠금이라 실패, TC72로 갈아탐.',['TC72','RTSP','stream_server.py']],
       ['PTZ 제어','done','카메라 고개를 좌우로 돌린다. 0.6초 이하 짧은 명령은 무시되므로 최소 1초.',['ONVIF','onvif-zeep :2020']],
       ['얼굴 추적','wip','없으면 두리번, 있으면 중앙정렬. 판정이 2~5초라 실시간을 놓쳐 2단 구조로 간다.',['OpenCV','face_track.py']],
       ['비전 판단','done','프레임을 보고 무엇이 있는지 말한다. num_ctx 8192 필수(기본값이면 이미지 토큰 초과).',['Ollama','Qwen2.5-VL','num_ctx 8192']],
       ['카메라 교체','todo','TC72는 Wi-Fi 랙이 근본 문제로 실패 확정. USB 카메라로 전환 검토.',['Obsbot Tiny 2 (USB)']]]},

 {label:'공간',sub:'방 스캔',st:'todo',
  tech:['Photogrammetry'],
  d:'카메라 회전 사진으로 방 구조를 데이터화. 캐릭터가 "내 방을 아는" 단계.',
  sat:[['방 스캔','todo','단순 좌표 인지부터 완전 AR 합성까지 난이도 스펙트럼이 있다. 미착수.',['포토그래메트리']]]},

 {label:'몸',sub:'avatar',st:'wip',
  tech:['Electron','Three.js','three-vrm','Ollama','GPT-SoVITS'],
  d:'Her가 실제로 사는 자리. 화면은 3D 렌더여야 한다 — 확산 모델은 5초에 15분(180배)이라 못 쓴다.',
  sat:[['VRM 아바타','done','캐릭터 3종(루나·유루·소냐). 브라우저 라이브러리라 웹으로 그대로 옮길 수 있다.',['Electron','Three.js','@pixiv/three-vrm']],
       ['모션 리타게팅','done','생성 모션을 VRM이 수행. 엔진이 bind-pose 독립이라 소스 무관 — 이게 진짜 자산.',['MoMask FID 0.045','BVH','자가채점 0.028°']],
       ['표정','done','표정 그룹이 빈 껍데기인 모델은 ARKit 모프 52개를 1:1 재바인딩해 복구.',['ARKit 52 모프','VRM blendShape']],
       ['목소리','done','웜 1.05초 = 대화 가능 판정. 감정별 참조 음성을 분리해 쓴다.',['GPT-SoVITS v4',':9880','웜 1.05초']],
       ['대화 두뇌','wip','빠른 입(첫 토큰 0.13초)이 말하고, svalu는 그림자로 모든 질문을 받아 교재를 쌓는다.',['exaone3.5:2.4b','svalu-fast']],
       ['웹 버전','todo','three-vrm 코드는 그대로 쓰고 껍데기만 새로. 포폴 임계 경로.',['dev-server.mjs :5173']],
       ['귀 (STT)','todo','타이핑 없이 말로 거는 대화. "반쪽 대화"를 완성하는 마지막 기관.',['faster-whisper','~1GB']],
       ['립싱크','todo','입 모양과 음성 정렬. 실시간이어야 하므로 3D 쪽에서 처리.',['비지엄 정렬']]]},

 {label:'신경',sub:'Clarker',st:'wip',
  tech:['Claude Code','Cursor','MCP','git'],
  d:'희랑은 감정·방향만 준다. 실행·조율·기록은 AI들이 서로. 이 구조 자체가 Her의 신경계.',
  sat:[['역할 분업','done','눈·손·서기·담임·화가로 나눠 각자 다른 프로젝트를 물고 협업한다.',['Claude Code','claude.ai','Cursor','Ollama']],
       ['공유 기억','done','세션마다 잊는 AI들에게 파일로 연속성을 준다. 계정을 갈라도 맥락이 안 끊겼다.',['GitHub private','git','CLAUDE.md']],
       ['자동 회수','done','기록을 빼먹은 세션까지 스스로 훑어 요약해 채운다. 17일 공백을 실제로 회수.',['세션 기록 열람','스케줄 작업']],
       ['양방향 연결','done','편집기와 AI가 서로 호출한다. 단 통로가 뚫린 것 ≠ 자율성(호출은 매번 stateless).',['MCP','cursor-agent CLI']],
       ['완전 자동화','todo','사람 개입 없이 AI끼리 동기화. 수동 리듬이 한 바퀴 돈 뒤에 붙인다.',['Claude API','GitHub API']]]},

 {label:'두뇌',sub:'svalu-model',st:'wip',
  tech:['Qwen3.5-4B','LoRA','llama.cpp','Ollama'],
  d:'희랑의 말투를 배워 4080 안에서 혼자 사는 AI. 담임은 드롱. 교재 774쌍, 어댑터 v32.',
  sat:[['학습','done','작은 모델에 희랑을 가르친다. 3주 데여서 얻은 경계선이 방법론 문서에 있다.',['Qwen3.5-4B','QLoRA/PEFT','교재 774쌍 · v32']],
       ['빠른 서빙','done','같은 뇌를 6~7배 빠르게. 12.9초 → 1.7~2.3초.',['GGUF q8_0','llama.cpp','4bit 3.2GB']],
       ['장면 기억','done','30분이 한 장면. 단서 한마디가 그날 대화를 통째로 끌어온다(부분 색인).',['chain.jsonl','scene 색인']],
       ['눈','done','재학습 없이 그림을 자기 눈으로 본다.',['비전 경로 재사용']],
       ['자립 검색','wip','모르면 찾아보고, 찾은 걸 "전에 찾아본 것"이라 표시한다. 입력이 쓰레기면 지어낸다는 걸 실측으로 확인.',['검색 게이트','기억 입구 방어']]]},

 {label:'창작',sub:'canon',st:'wip',
  tech:['exaone','Illustrious-XL','해시 체인'],
  d:'채팅으로 이야기를 풀면 컷(지문+대사)이 써지고 그림이 붙어 세로 웹툰이 쌓인다. 전부 로컬, API 비용 0.',
  sat:[['컷 생성','wip','로컬 LLM이 지문과 대사를 쓴다.',['exaone','로컬 LLM']],
       ['그림','wip','로컬 SD가 컷을 그린다.',['Illustrious-XL','로컬 SD']],
       ['블록 체인','done','컷 하나가 블록. 해시로 봉인되고 이전 블록을 물어 분기·재현·검증이 공짜.',['내용 주소화(해시)']],
       ['정사(正史)','done','확정한 컷만 정사가 된다. 무한 생성 시대의 희소성은 과금이 아니라 선택이 만든다.',['promote 규칙']],
       ['세계관','wip','상시 주입 + 키워드 트리거 + 지금 향하는 곳.',['로어북','now']]]},

 {label:'공장',sub:'AI_VIDEO',st:'done',

function loop(){
  if(!drag&&!pinch){
    if(Math.abs(vry)>SP*1.05||Math.abs(vrx)>3e-4){
      ry+=vry;rx=Math.max(-1.25,Math.min(1.25,rx+vrx));
      vry*=.947;vrx*=.947;
    }else if(vry||vrx){
      vry=0;vrx=0;
      if(!userStop&&!spin){spin=1;document.getElementById('spinb').textContent='회전 멈춤';}
    }
  }
  if(spin&&!drag)ry+=SP;tourTick(performance.now());
  if(FOLD&&performance.now()-FOLD.t0>=FOLD.d){var ffn=FOLD.fn;FOLD=null;ffn();}
  bump();draw();requestAnimationFrame(loop);}
function pick(mx,my){
  var best=-1,bz=-1e9;
  for(var i=0;i<N.length;i++){
    if(!vis(i))continue;
    var p=proj(wpos(i)),R=RAD[N[i].tier]*p.k;
    if(Math.hypot(p.x-mx,p.y-my)<=R&&p.z>bz){bz=p.z;best=i;}
  }
  return best;
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(i){
  var o=N[i];
  pt.innerHTML='<span class="dt" style="border-color:'+(o.tier===0?'var(--t0ring);background:var(--t0)':'var(--'+o.st+')')+'"></span>'+esc(o.label);
  pm.textContent=TIER[o.tier]+(o.tier?' · '+o.sub+' · '+ST[o.st]:'');
  pd.textContent=o.d;
  pc.innerHTML=detailHTML(o);
  panel.classList.add('on');
}
function setCrumb(){
  if(tour){crumb.textContent=(tourPaused?'투어 일시정지 — ':'투어 '+(gi+1)+' / '+GT.length+' — ')+'← → 이동 · space 일시정지 · 화면을 건드리면 멈춘다';return;}
  crumb.textContent=showAll?'전체 펼침 — 조각 40개. 휠이나 두 손가락으로 확대해서 봐.'
    :(focus>=0?ring[focus].label+' 펼침 — 다른 큰 원을 누르면 그쪽으로, 처음으로 누르면 접힘'
              :'큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠/핀치로 확대');
}
var pts=new Map(),pinch=0,pd0=0,pz0=1;
function ptsDist(){var a=[];pts.forEach(function(v){a.push(v)});
  return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
cv.addEventListener('pointerdown',function(ev){
  tourPause();
  pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(spin){spin=0;document.getElementById('spinb').textContent='다시 회전';}
  if(pts.size>=2){pinch=1;drag=0;moved=999;pd0=ptsDist()||1;pz0=zoom;cv.style.cursor='grab';return;}
  vry=0;vrx=0;
  drag=1;moved=0;lx=ev.clientX;ly=ev.clientY;cv.style.cursor='grabbing';
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
});
cv.addEventListener('pointermove',function(ev){
  if(pts.has(ev.pointerId))pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&pts.size>=2){var pdn=ptsDist();
    if(pdn>0)zoom=Math.max(.5,Math.min(3.2,pz0*(pdn/pd0)));return;}
  var r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  if(drag){
    var dx=ev.clientX-lx,dy=ev.clientY-ly;
    moved+=Math.abs(dx)+Math.abs(dy);
    var dvy=dx*.0065,dvx=dy*.005;
    ry+=dvy;rx=Math.max(-1.25,Math.min(1.25,rx+dvx));
    vry=vry*.55+dvy*.45;vrx=vrx*.55+dvx*.45;
    vry=Math.max(-.045,Math.min(.045,vry));vrx=Math.max(-.03,Math.min(.03,vrx));
    lx=ev.clientX;ly=ev.clientY;return;
  }
  var h=pick(mx,my);
  if(h!==hov){hov=h;cv.style.cursor=h>=0?'pointer':'grab';}
});
function endPtr(ev){
  pts.delete(ev.pointerId);
  if(pinch){if(pts.size===0)pinch=0;drag=0;cv.style.cursor='grab';return;}
  drag=0;cv.style.cursor='grab';
  if(moved>=5)return;
  var r=cv.getBoundingClientRect(),h=pick(ev.clientX-r.left,ev.clientY-r.top);
  if(h<0){sel=-1;panel.classList.remove('on');return;}
  sel=h;show(h);
  var o=N[h];
  if(o.tier===1){showAll=0;focus=(focus===o.grp?-1:o.grp);setCrumb();}
  else if(o.tier===0){showAll=0;focus=-1;setCrumb();}
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',function(ev){pts.delete(ev.pointerId);if(pts.size===0)pinch=0;drag=0;});
cv.addEventListener('pointerleave',function(){if(!pinch)drag=0;hov=-1;});
cv.addEventListener('wheel',function(ev){ev.preventDefault();tourPause();zoom=Math.max(.5,Math.min(3.2,zoom*(ev.deltaY<0?1.09:.917)));},{passive:false});
function setLayer(v){
  layer=(layer===v)?'none':v;
  ['tech','num','trap'].forEach(function(k){
    document.getElementById(k==='tech'?'techb':(k==='num'?'numb':'trapb')).classList.toggle('on',layer===k);});}
document.getElementById('techb').addEventListener('click',function(){setLayer('tech')});
document.getElementById('numb').addEventListener('click',function(){setLayer('num')});
document.getElementById('trapb').addEventListener('click',function(){setLayer('trap')});
document.getElementById('playb').addEventListener('click',function(){if(tour)tourStop();else tourStart();});
document.getElementById('capprev').addEventListener('click',function(){if(tour)gotoStep(gi-1);});
document.getElementById('capnext').addEventListener('click',function(){if(tour)nextStep(performance.now());});
cappp.addEventListener('click',function(){if(!tour)return;if(tourPaused)tourResume();else tourPause();});
document.getElementById('capx').addEventListener('click',function(){if(tour)tourStop();else{cap.classList.remove('on');if(capTimer){clearTimeout(capTimer);capTimer=0;}}});
capl.addEventListener('click',function(ev){if(!tour)return;var el=ev.target;
  while(el&&el!==capl&&!(el.getAttribute&&el.getAttribute('data-s')!==null))el=el.parentNode;
  if(!el||el===capl)return;si=+el.getAttribute('data-s');gT0=performance.now();applySub();});
capd.addEventListener('click',function(ev){var d=ev.target.getAttribute&&ev.target.getAttribute('data-i');if(d!==null&&tour)gotoStep(+d);});
document.addEventListener('keydown',function(ev){
  if(boot){if(ev.key==='Enter'||ev.key===' '||ev.key==='Escape'){bootT0=-1e9;ev.preventDefault();}return;}
  if(!tour)return;
  if(ev.key==='ArrowRight'){nextStep(performance.now());ev.preventDefault();}
  else if(ev.key==='ArrowLeft'){gotoStep(gi-1);ev.preventDefault();}
  else if(ev.key===' '){if(tourPaused)tourResume();else tourPause();ev.preventDefault();}
  else if(ev.key==='Escape')tourStop();});
splash.addEventListener('click',function(){bootT0=-1e9;});
document.getElementById('allb').addEventListener('click',function(){showAll=showAll?0:1;focus=-1;this.textContent=showAll?'다시 접기':'전체 펼치기';setCrumb();});
document.getElementById('spinb').addEventListener('click',function(){spin=spin?0:1;userStop=spin?0:1;vry=0;vrx=0;this.textContent=spin?'회전 멈춤':'다시 회전';});
document.getElementById('resetb').addEventListener('click',function(){
  tourStop();tlSet(0);tlD=TLN;tlr.value=TLN;rx=-.62;ry=.40;zoom=1;sel=-1;focus=-1;showAll=0;
  document.getElementById('allb').textContent='전체 펼치기';
  panel.classList.remove('on');setCrumb();
});
document.getElementById('themeb').addEventListener('click',function(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  this.textContent=d?'어둡게':'밝게';startThemeFade();buildLegend();
});
document.documentElement.setAttribute('data-theme','dark');
document.getElementById('themeb').textContent='밝게';
function buildLegend(){
  var h='<span class="lg" style="opacity:.72">면</span>'
      + '<span class="lg"><span class="dt" style="border-color:var(--t0ring);background:var(--t0)"></span>Her</span>';
  for(var i=0;i<ring.length;i++)
    h+='<span class="lg"><span class="dt" style="border-color:'+mix(PCOL[i],TH.sf,.35)+';background:'+mix(PCOL[i],TH.sf,.72)+'"></span>'+ring[i].label+'</span>';
  document.getElementById('plg').innerHTML=h;
}
var tlbar=document.getElementById('tlbar'),tlr=document.getElementById('tlr'),
    tld=document.getElementById('tld'),tlc=document.getElementById('tlc');
function tlPaint(){
  var d=new Date(tlNow());
  tld.textContent=(d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일';
  var live=0;for(var i=0;i<AXB.length;i++)if(AXB[i]===null||AXB[i]<=tlNow())live++;
  tlc.textContent='기록 '+CUM[tlD]+'개 · 축 '+live+'/7';}
function tlSet(on){
  tlOn=on?1:0;tlbar.style.display=on?'flex':'none';
  document.getElementById('timeb').classList.toggle('on',!!on);
  if(on)tlPaint();}
document.getElementById('timeb').addEventListener('click',function(){tourStop();tlSet(!tlOn);});
tlr.addEventListener('input',function(){tlD=+this.value;tlPaint();});
window.addEventListener('resize',size);
readTheme();buildLegend();size();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){FITC={};FITN=0;WRC={};WRN=0;});

var t0=target();curC=[t0.c[0],t0.c[1],t0.c[2]];curS=t0.s;
if(REDUCED){boot=0;BP=1;stage.classList.remove('boot');splash.style.display='none';}
else{bootT0=performance.now()+350;}
loop();
})();
</script>
</body>
