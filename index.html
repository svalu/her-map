<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트 Her — 구조와 기술</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --bg:#f7f6f4; --surface:#ffffff; --line:#d9d5cf;
  --tx:#26241f; --tx2:#5c574f; --tx3:#8d8880;
  --done:#5f9068; --wip:#c08a3e; --todo:#9a948c; --chip:#f0eeea; --hud:#3d3a34;
  --t0:#34302b; --t0tx:#faf7f2; --t0ring:#b9b1a4; --t1:#e9f0eb; --t2:#ffffff;
}
:root[data-theme="dark"]{
  --bg:#191816; --surface:#232120; --line:#3b3835;
  --tx:#f5f2ec; --tx2:#d2ccc2; --tx3:#aaa39a;
  --done:#8fbe97; --wip:#e6b268; --todo:#9b968f; --chip:#2c2a28; --hud:#b8b1a8;
  --t0:#55504a; --t0tx:#f6f2ec; --t0ring:#9c948a; --t1:#28302b; --t2:#232120;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.hud{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top{top:16px;left:20px;right:20px;justify-content:space-between}
#ttl{font-size:15px;font-weight:500;letter-spacing:-.01em}
#crumb{font-size:12.5px;color:var(--hud);margin-top:3px}
.btn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--tx2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.on{border-color:var(--tx2);color:var(--tx)}
#legend{bottom:16px;left:20px;gap:11px;max-width:calc(100% - 260px)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hud)}
.ln{width:18px;height:0;border-top:2px solid var(--hud);display:inline-block;flex:none}
.ln.d2{border-top-style:dashed}
.ln.d3{border-top-style:dotted}
.dt{width:10px;height:10px;border-radius:50%;border:2px solid;background:var(--surface);flex:none}
#hint{bottom:16px;right:20px;font-size:11.5px;color:var(--hud);text-align:right;max-width:220px;line-height:1.5}
#panel{position:absolute;top:78px;right:20px;width:308px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
#panel.on{opacity:1;transform:none}
#pt{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
#pm{font-size:11px;color:var(--tx3);margin:5px 0 8px}
#pd{font-size:12.5px;color:var(--tx2);line-height:1.65}
#pc{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mrow{width:100%;font-size:11.5px;color:var(--tx2);margin-bottom:6px;line-height:1.5}
.mrow b{font-weight:500;color:var(--tx3);margin-right:5px}
.mrow.trap{color:var(--wip)}
.mrow.trap b{color:var(--wip);opacity:.8}
.chip{font-size:10.5px;color:var(--tx2);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
@media (max-width:640px){
  #top{top:10px;left:12px;right:12px}
  #ttl{font-size:14px}
  #crumb{font-size:11px;line-height:1.45}
  .btn{font-size:11px;padding:4px 8px}
  #hint{display:none}
  #legend{left:12px;right:12px;bottom:12px;max-width:none;gap:8px}
  .lg{font-size:11px;gap:4px}
  #allb,#spinb{display:none}
  #tlbar{bottom:58px;left:12px;right:12px;gap:7px}
  #tld,#tlc{font-size:11px}
  #panel{top:auto;bottom:84px;left:12px;right:12px;width:auto;max-height:38vh;overflow:auto}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="top">
    <div>
      <div id="ttl">프로젝트 Her — 구조와 기술</div>
      <div id="crumb">큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠/핀치로 확대</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="playb">재생</button>
      <span style="width:1px;height:18px;background:var(--line);align-self:center"></span>
      <button class="btn on" id="techb">기술</button>
      <button class="btn" id="numb">숫자</button>
      <button class="btn" id="trapb">함정</button>
      <span style="width:1px;height:18px;background:var(--line);align-self:center"></span>
      <button class="btn" id="timeb">시간</button>
      <button class="btn" id="allb">전체 펼치기</button>
      <button class="btn" id="spinb">회전 멈춤</button>
      <button class="btn" id="themeb">어둡게</button>
      <button class="btn" id="resetb">처음으로</button>
    </div>
  </div>
  <div class="hud" id="legend">
    <span id="plg" style="display:flex;gap:11px;flex-wrap:wrap;align-items:center"></span>
    <span style="width:1px;height:16px;background:var(--line);margin:0 4px"></span>
    <span class="lg" style="opacity:.72">테두리</span>
    <span class="lg"><i class="ln"></i>완성</span>
    <span class="lg"><i class="ln d2"></i>진행 중</span>
    <span class="lg"><i class="ln d3"></i>미착수</span>
  </div>
  <div class="hud" id="tlbar" style="display:none;left:20px;right:20px;bottom:54px;gap:10px;align-items:center">
    <span id="tld" style="font-size:12px;color:var(--hud);min-width:92px;white-space:nowrap"></span>
    <input id="tlr" type="range" min="0" max="59" value="59" style="flex:1;accent-color:var(--tx2);min-width:120px">
    <span id="tlc" style="font-size:11.5px;color:var(--hud);opacity:.85;white-space:nowrap"></span>
  </div>
  <div class="hud" id="hint">점선 = 부품이 건너가는 길<br>전부 RTX 4080 로컬 · API 비용 0</div>
  <div id="panel"><div id="pt"></div><div id="pm"></div><div id="pd"></div><div id="pc"></div></div>
</div>
<script>
(function(){
var ST={done:'완성',wip:'진행 중',todo:'미착수'};
var ring=[
 {label:'눈',sub:'AI_EYE',st:'wip',

  sat:[['RTSP 연결','done','카메라 영상을 실시간으로 받는다. 샤오미 홈캠은 클라우드 잠금이라 실패, TC72로 갈아탐.',['TC72','RTSP','stream_server.py']],

       ['얼굴 추적','wip','없으면 두리번, 있으면 중앙정렬. 판정이 2~5초라 실시간을 놓쳐 2단 구조로 간다.',['OpenCV','face_track.py']],

       ['카메라 교체','todo','TC72는 Wi-Fi 랙이 근본 문제로 실패 확정. USB 카메라로 전환 검토.',['Obsbot Tiny 2 (USB)']]]},

 {label:'공간',sub:'방 스캔',st:'todo',

 {label:'신경',sub:'Clarker',st:'wip',

 {label:'창작',sub:'canon',st:'wip',

 'Her':['RTX 4080 16GB','API 비용 0'],

    var yy=pp.y-totalH/2+hs[0]/2-1;
    g2.textAlign='center';g2.textBaseline='middle';
    for(var L=0;L<lines.length;L++){
      if(styles[L]===3){g2.font='400 '+techFs+'px '+FAM;g2.fillStyle=fog(TH.wip,pp.z,.3);}
      else if(styles[L]===1){g2.font='400 '+techFs+'px '+FAM;g2.fillStyle=fog(o.tier===0?TH.t0ring:TH.tx3,pp.z,.34);}
      else if(styles[L]===2){g2.font='400 '+projFs+'px '+FAM;g2.fillStyle=fog(TH.tx2,pp.z,.34);}
      else{g2.font=(o.tier===2?'400 ':'500 ')+f.fs+'px '+FAM;g2.fillStyle=fog(o.tier===0?TH.t0tx:TH.tx,pp.z,.3);}
      g2.fillText(lines[L],pp.x,yy);
      yy+=hs[L];
    }
  }
  g2.globalAlpha=1;
}
function layerLines(o){
  if(layer==='tech')return o.tech||[];
  if(layer==='num')return o.num||[];
  if(layer==='trap')return o.trap?[o.trap]:[];
  return [];}
function axisOf(g){for(var i=0;i<N.length;i++)if(N[i].tier===1&&N[i].grp===g)return i;return -1;}
var tour=0,tourI=0,tourT=0,DWELL=3800;
var TSEQ=[-1,0,1,2,3,4,5,6];
function tourStop(){if(!tour)return;tour=0;document.getElementById('playb').textContent='재생';
  document.getElementById('playb').classList.remove('on');setCrumb();}
function tourStep(){
  var s=TSEQ[tourI];
  showAll=0;
  if(s<0){focus=-1;sel=0;show(0);}
  else{focus=s;var ax=axisOf(s);if(ax>=0){sel=ax;show(ax);}}
  setCrumb();}
function tourTick(now){
  if(!tour)return;
  if(now-tourT<DWELL)return;
  tourI++;
  if(tourI>=TSEQ.length){tourStop();focus=-1;sel=-1;panel.classList.remove('on');setCrumb();return;}
  tourT=now;tourStep();}
function fkey(){return showAll?'A':(focus>=0?'F'+focus:'-')}
function bump(){var k=fkey();if(k!==prevFocusKey){prevFocusKey=k;anim0=performance.now();animDir=(k!=='-');}}
function loop(){
  if(!drag&&!pinch&&(Math.abs(vry)>2e-4||Math.abs(vrx)>2e-4)){
    ry+=vry;rx=Math.max(-1.25,Math.min(1.25,rx+vrx));
    vry*=.947;vrx*=.947;
  }else{vry=0;vrx=0;}
  if(spin&&!drag)ry+=.0022;tourTick(performance.now());bump();draw();requestAnimationFrame(loop);}
function pick(mx,my){
  var best=-1,bz=-1e9;
  for(var i=0;i<N.length;i++){
    if(!vis(i))continue;
    var p=proj(wpos(i)),R=RAD[N[i].tier]*p.k;
    if(Math.hypot(p.x-mx,p.y-my)<=R&&p.z>bz){bz=p.z;best=i;}
  }
  return best;
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(i){
  var o=N[i];
  pt.innerHTML='<span class="dt" style="border-color:'+(o.tier===0?'var(--t0ring);background:var(--t0)':'var(--'+o.st+')')+'"></span>'+esc(o.label);
  pm.textContent=TIER[o.tier]+(o.tier?' · '+o.sub+' · '+ST[o.st]:'');
  pd.textContent=o.d;
  var extra='';
  if(o.num&&o.num.length)extra+='<div class="mrow"><b>실측</b> '+o.num.map(esc).join(' · ')+'</div>';
  if(o.trap)extra+='<div class="mrow trap"><b>데인 곳</b> '+esc(o.trap)+'</div>';
  pc.innerHTML=extra+(o.tech||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  panel.classList.add('on');
}
function setCrumb(){
  if(tour){crumb.textContent='자동 투어 '+(tourI+1)+' / '+TSEQ.length+' — 화면을 건드리면 멈춘다';return;}
  crumb.textContent=showAll?'전체 펼침 — 조각 40개. 휠이나 두 손가락으로 확대해서 봐.'
    :(focus>=0?ring[focus].label+' 펼침 — 다른 큰 원을 누르면 그쪽으로, 처음으로 누르면 접힘'
              :'큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠/핀치로 확대');
}
var pts=new Map(),pinch=0,pd0=0,pz0=1;
function ptsDist(){var a=[];pts.forEach(function(v){a.push(v)});
  return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
cv.addEventListener('pointerdown',function(ev){
  tourStop();
  pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(spin){spin=0;document.getElementById('spinb').textContent='다시 회전';}
  if(pts.size>=2){pinch=1;drag=0;moved=999;pd0=ptsDist()||1;pz0=zoom;cv.style.cursor='grab';return;}
  vry=0;vrx=0;
  drag=1;moved=0;lx=ev.clientX;ly=ev.clientY;cv.style.cursor='grabbing';
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
});
cv.addEventListener('pointermove',function(ev){
  if(pts.has(ev.pointerId))pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&pts.size>=2){var pdn=ptsDist();
    if(pdn>0)zoom=Math.max(.5,Math.min(3.2,pz0*(pdn/pd0)));return;}
  var r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  if(drag){
    var dx=ev.clientX-lx,dy=ev.clientY-ly;
    moved+=Math.abs(dx)+Math.abs(dy);
    var dvy=dx*.0065,dvx=dy*.005;
    ry+=dvy;rx=Math.max(-1.25,Math.min(1.25,rx+dvx));
    vry=vry*.55+dvy*.45;vrx=vrx*.55+dvx*.45;
    vry=Math.max(-.045,Math.min(.045,vry));vrx=Math.max(-.03,Math.min(.03,vrx));
    lx=ev.clientX;ly=ev.clientY;return;
  }
  var h=pick(mx,my);
  if(h!==hov){hov=h;cv.style.cursor=h>=0?'pointer':'grab';}
});
function endPtr(ev){
  pts.delete(ev.pointerId);
  if(pinch){if(pts.size===0)pinch=0;drag=0;cv.style.cursor='grab';return;}
  drag=0;cv.style.cursor='grab';
  if(moved>=5)return;
  var r=cv.getBoundingClientRect(),h=pick(ev.clientX-r.left,ev.clientY-r.top);
  if(h<0){sel=-1;panel.classList.remove('on');return;}
  sel=h;show(h);
  var o=N[h];
  if(o.tier===1){showAll=0;focus=(focus===o.grp?-1:o.grp);setCrumb();}
  else if(o.tier===0){showAll=0;focus=-1;setCrumb();}
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',function(ev){pts.delete(ev.pointerId);if(pts.size===0)pinch=0;drag=0;});
cv.addEventListener('pointerleave',function(){if(!pinch)drag=0;hov=-1;});
cv.addEventListener('wheel',function(ev){ev.preventDefault();tourStop();zoom=Math.max(.5,Math.min(3.2,zoom*(ev.deltaY<0?1.09:.917)));},{passive:false});
function setLayer(v){
  layer=(layer===v)?'none':v;
  ['tech','num','trap'].forEach(function(k){
    document.getElementById(k==='tech'?'techb':(k==='num'?'numb':'trapb')).classList.toggle('on',layer===k);});}
document.getElementById('techb').addEventListener('click',function(){setLayer('tech')});
document.getElementById('numb').addEventListener('click',function(){setLayer('num')});
document.getElementById('trapb').addEventListener('click',function(){setLayer('trap')});
document.getElementById('playb').addEventListener('click',function(){
  if(tour){tourStop();return;}
  tour=1;tourI=0;tourT=performance.now();this.textContent='정지';this.classList.add('on');
  if(!spin){spin=1;document.getElementById('spinb').textContent='회전 멈춤';}
  tourStep();});
document.getElementById('allb').addEventListener('click',function(){showAll=showAll?0:1;focus=-1;this.textContent=showAll?'다시 접기':'전체 펼치기';setCrumb();});
document.getElementById('spinb').addEventListener('click',function(){spin=spin?0:1;this.textContent=spin?'회전 멈춤':'다시 회전';});
document.getElementById('resetb').addEventListener('click',function(){
  tourStop();tlSet(0);tlD=TLN;tlr.value=TLN;rx=-.62;ry=.40;zoom=1;sel=-1;focus=-1;showAll=0;
  document.getElementById('allb').textContent='전체 펼치기';
  panel.classList.remove('on');setCrumb();
});
document.getElementById('themeb').addEventListener('click',function(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  this.textContent=d?'어둡게':'밝게';readTheme();buildLegend();
});
document.documentElement.setAttribute('data-theme','dark');
document.getElementById('themeb').textContent='밝게';
function buildLegend(){
  var h='<span class="lg" style="opacity:.72">면</span>'
      + '<span class="lg"><span class="dt" style="border-color:var(--t0ring);background:var(--t0)"></span>Her</span>';
  for(var i=0;i<ring.length;i++)
    h+='<span class="lg"><span class="dt" style="border-color:'+mix(PCOL[i],TH.sf,.35)+';background:'+mix(PCOL[i],TH.sf,.72)+'"></span>'+ring[i].label+'</span>';
  document.getElementById('plg').innerHTML=h;
}
var tlbar=document.getElementById('tlbar'),tlr=document.getElementById('tlr'),
    tld=document.getElementById('tld'),tlc=document.getElementById('tlc');
function tlPaint(){
  var d=new Date(tlNow());
  tld.textContent=(d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일';
  var live=0;for(var i=0;i<AXB.length;i++)if(AXB[i]===null||AXB[i]<=tlNow())live++;
  tlc.textContent='기록 '+CUM[tlD]+'개 · 축 '+live+'/7';}
function tlSet(on){
  tlOn=on?1:0;tlbar.style.display=on?'flex':'none';
  document.getElementById('timeb').classList.toggle('on',!!on);
  if(on)tlPaint();}
document.getElementById('timeb').addEventListener('click',function(){tourStop();tlSet(!tlOn);});
tlr.addEventListener('input',function(){tlD=+this.value;tlPaint();});
window.addEventListener('resize',size);
readTheme();buildLegend();size();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){FITC={};FITN=0;WRC={};WRN=0;});

var t0=target();curC=[t0.c[0],t0.c[1],t0.c[2]];curS=t0.s;
loop();
})();
</script>
