<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트 Her — 구조와 기술</title>
<style>
:root{
  --bg:#f7f6f4; --surface:#ffffff; --line:#d9d5cf;
  --tx:#26241f; --tx2:#5c574f; --tx3:#8d8880;
  --done:#5f9068; --wip:#c08a3e; --todo:#9a948c; --chip:#f0eeea;
  --t0:#34302b; --t0tx:#faf7f2; --t0ring:#b9b1a4; --t1:#e9f0eb; --t2:#ffffff;
}
:root[data-theme="dark"]{
  --bg:#191816; --surface:#232120; --line:#3b3835;
  --tx:#eceae6; --tx2:#b4afa7; --tx3:#847f78;
  --done:#7fae87; --wip:#d9a458; --todo:#7c7873; --chip:#2c2a28;
  --t0:#55504a; --t0tx:#f6f2ec; --t0ring:#9c948a; --t1:#28302b; --t2:#232120;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.hud{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top{top:16px;left:20px;right:20px;justify-content:space-between}
#ttl{font-size:15px;font-weight:500;letter-spacing:-.01em}
#crumb{font-size:12.5px;color:var(--tx3);margin-top:3px}
.btn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--tx2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.on{border-color:var(--tx2);color:var(--tx)}
#legend{bottom:16px;left:20px;gap:11px;max-width:calc(100% - 260px)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.dt{width:10px;height:10px;border-radius:50%;border:2px solid;background:var(--surface);flex:none}
#hint{bottom:16px;right:20px;font-size:11.5px;color:var(--tx3);text-align:right;max-width:220px;line-height:1.5}
#panel{position:absolute;top:78px;right:20px;width:308px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
#panel.on{opacity:1;transform:none}
#pt{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
#pm{font-size:11px;color:var(--tx3);margin:5px 0 8px}
#pd{font-size:12.5px;color:var(--tx2);line-height:1.65}
#pc{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:10.5px;color:var(--tx2);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="top">
    <div>
      <div id="ttl">프로젝트 Her — 구조와 기술</div>
      <div id="crumb">큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠로 확대</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="techb">기술 보기</button>
      <button class="btn" id="allb">전체 펼치기</button>
      <button class="btn" id="spinb">회전 멈춤</button>
      <button class="btn" id="themeb">어둡게</button>
      <button class="btn" id="resetb">처음으로</button>
    </div>
  </div>
  <div class="hud" id="legend">
    <span id="plg" style="display:flex;gap:11px;flex-wrap:wrap;align-items:center"></span>
    <span style="width:1px;height:16px;background:var(--line);margin:0 4px"></span>
    <span class="lg" style="color:var(--tx3)">테두리</span>
    <span class="lg"><span class="dt" style="border-color:var(--done)"></span>완성</span>
    <span class="lg"><span class="dt" style="border-color:var(--wip)"></span>진행 중</span>
    <span class="lg"><span class="dt" style="border-color:var(--todo)"></span>미착수</span>
  </div>
  <div class="hud" id="hint">점선 = 부품이 건너가는 길<br>전부 RTX 4080 로컬 · API 비용 0</div>
  <div id="panel"><div id="pt"></div><div id="pm"></div><div id="pd"></div><div id="pc"></div></div>
</div>

function hsl2(h,s,l){h=(h%360+360)%360;s/=100;l/=100;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}

function wpos(i,full){
  var o=N[i];
  if(o.tier<2)return o.p;
  var pp=N[o.par].p,cy=Math.cos(ry),sy=Math.sin(ry),c1=Math.cos(rx),s1=Math.sin(rx);
  var CR=1.34*(full?1:(.18+.82*satA(o)));
  var c=Math.cos(o.th)*CR,s=Math.sin(o.th)*CR;
  return[pp[0]*1.18+cy*c+sy*s1*s, pp[1]*1.18+c1*s, pp[2]*1.18+sy*c-cy*s1*s];
}
function target(){
  var idx=[],k,zin=(focus>=0&&!showAll);
  if(zin){for(k=0;k<N.length;k++)if(N[k].grp===focus)idx.push(k);}
  else{for(k=0;k<N.length;k++)if(vis(k))idx.push(k);}
  var c=[0,0,0];
  for(k=0;k<idx.length;k++){var w=wpos(idx[k],1);c[0]+=w[0];c[1]+=w[1];c[2]+=w[2];}
  c[0]/=idx.length;c[1]/=idx.length;c[2]/=idx.length;
  var eh=0,ev=0,mr=0;
  for(k=0;k<idx.length;k++){
    var p=wpos(idx[k],1),rr=RAD[N[idx[k]].tier]*1.12;
    var h=Math.hypot(p[0]-c[0],p[2]-c[2]);
    if(h>eh)eh=h;
    if(Math.abs(p[1]-c[1])>ev)ev=Math.abs(p[1]-c[1]);
    if(rr>mr)mr=rr;
  }
  eh+=mr;
  var evv=ev*Math.abs(Math.cos(rx))+eh*Math.abs(Math.sin(rx))+mr;
  var pad=zin?1.5:1;
  return{c:c,s:Math.min((W/2-24)/Math.max(eh*pad,.8),(H/2-30)/Math.max(evv*pad,.8))};
}
function proj(p){
  var x0=p[0]-curC[0],y0=p[1]-curC[1],z0=p[2]-curC[2];
  var cy=Math.cos(ry),sy=Math.sin(ry),cxx=Math.cos(rx),sxx=Math.sin(rx);
  var x=x0*cy+z0*sy, z1=-x0*sy+z0*cy;
  var y=y0*cxx-z1*sxx, z=y0*sxx+z1*cxx;
  var f=11,d=f-z,k=curS*zoom*(f/d);
  return{x:W/2+x*k,y:H/2-y*k,z:z,k:k};
}
function wrap(txt,maxw,fs){
  g2.font='400 '+fs+'px '+FAM;
  if(g2.measureText(txt).width<=maxw)return[txt];
  var parts=txt.split(' '),lines=[],cur='';
  if(parts.length>1){
    for(var i=0;i<parts.length;i++){
      var t=cur?cur+' '+parts[i]:parts[i];
      if(g2.measureText(t).width<=maxw)cur=t;else{if(cur)lines.push(cur);cur=parts[i];}
    }
    if(cur)lines.push(cur);return lines;
  }
  cur='';
  for(var c2=0;c2<txt.length;c2++){
    var t2=cur+txt[c2];
    if(g2.measureText(t2).width<=maxw)cur=t2;else{lines.push(cur);cur=txt[c2];}
  }
  if(cur)lines.push(cur);return lines;
}
function fit(txt,R){
  var start=Math.max(10,Math.min(19,R*.42));
  for(var fs=start;fs>=8.5;fs-=.5){
    var L=wrap(txt,R*1.55,fs);
    if(L.length<=3&&L.length*(fs*1.28)<=R*1.5)return{fs:fs,L:L};
  }
  return{fs:8.5,L:wrap(txt,R*1.55,8.5)};
}
function draw(){
  var tg=target();
  curC[0]+=(tg.c[0]-curC[0])*.12;curC[1]+=(tg.c[1]-curC[1])*.12;curC[2]+=(tg.c[2]-curC[2])*.12;
  curS+=(tg.s-curS)*.12;
  g2.clearRect(0,0,W,H);
  var P=N.map(function(o,i){return proj(wpos(i))});
  for(var e=0;e<E.length;e++){
    var A=E[e][0],B=E[e][1];
    if(!vis(A)||!vis(B))continue;
    var a=P[A],b=P[B],dashed=E[e][2],dz=(a.z+b.z)/2;
    var eo=N[B].tier===2?N[B]:(N[B].tier===1?N[B]:N[A]), ec=pcol(eo);
    var ea=Math.max(.16,Math.min(.62,.42+dz*.05));
    if(N[B].tier===2)ea*=satA(N[B]);
    g2.globalAlpha=ea;
    g2.strokeStyle=dashed?TH.tx3:(ec?mix(ec,TH.sf,.42):TH.line);
    g2.lineWidth=dashed?1.2:1.9;
    g2.setLineDash(dashed?[6,6]:[]);
    g2.beginPath();g2.moveTo(a.x,a.y);g2.lineTo(b.x,b.y);g2.stroke();
  }
  g2.setLineDash([]);g2.globalAlpha=1;
  var ord=[];
  for(var i=0;i<N.length;i++)if(vis(i))ord.push(i);
  ord.sort(function(a,b){return P[a].z-P[b].z});
  for(var q=0;q<ord.length;q++){
    var k=ord[q],o=N[k],pp=P[k],av=satA(o),R=RAD[o.tier]*pp.k*(o.tier===2?(.35+.65*av):1),col=TH[o.st],act=(k===hov||k===sel);
    if(o.tier===2&&av<=.02)continue;
    g2.globalAlpha=Math.max(.62,Math.min(1,.82+pp.z*.05))*(o.tier===2?av:1);
    g2.fillStyle=nodeFill(o);
    g2.beginPath();g2.arc(pp.x,pp.y,R,0,6.2832);g2.fill();
    if(o.tier===0){
      g2.strokeStyle=TH.t0ring;g2.lineWidth=act?5:3.5;g2.stroke();
      g2.globalAlpha=.55;g2.lineWidth=1;g2.beginPath();g2.arc(pp.x,pp.y,R-7,0,6.2832);g2.stroke();g2.globalAlpha=1;
    }else{
      g2.strokeStyle=col;g2.lineWidth=act?4.5:(o.tier===1?3.4:2.4);g2.stroke();
    }
    if(o.tier===1&&o.grp===focus){g2.globalAlpha=.5;g2.strokeStyle=col;g2.lineWidth=1;g2.beginPath();g2.arc(pp.x,pp.y,R+7,0,6.2832);g2.stroke();}
    if(act){g2.globalAlpha=1;g2.strokeStyle=TH.tx;g2.lineWidth=1;g2.beginPath();g2.arc(pp.x,pp.y,R+11,0,6.2832);g2.stroke();}
    g2.globalAlpha=(o.tier===2?Math.max(0,(av-.35)/.65):1);
    var f=fit(o.label,R), lines=f.L.slice(), styles=[];
    for(var z=0;z<lines.length;z++)styles.push(0);
    if(showTech&&o.tech&&o.tech.length&&R>26){
      var tfs=Math.max(8,f.fs*.72), room=Math.floor((R*1.5-f.L.length*f.fs*1.28)/(tfs*1.2));
      for(var t=0;t<o.tech.length&&t<Math.max(0,room)&&t<3;t++){
        var tl=wrap(o.tech[t],R*1.6,tfs);
        if(tl.length===1){lines.push(tl[0]);styles.push(1);}
      }
    }
    var lh=f.fs*1.28, tlh=Math.max(8,f.fs*.72)*1.25;
    var totalH=0;
    for(var z2=0;z2<lines.length;z2++)totalH+=styles[z2]?tlh:lh;
    var y0=pp.y-totalH/2+ (styles[0]?tlh:lh)/2 - 1;
    g2.textAlign='center';g2.textBaseline='middle';
    var yy=y0;
    for(var L=0;L<lines.length;L++){
      if(styles[L]){g2.font='400 '+Math.max(8,f.fs*.72)+'px '+FAM;g2.fillStyle=(o.tier===0?TH.t0ring:TH.tx3);}
      else{g2.font=(o.tier===2?'400 ':'500 ')+f.fs+'px '+FAM;g2.fillStyle=(o.tier===0?TH.t0tx:TH.tx);}
      g2.fillText(lines[L],pp.x,yy);
      yy+=styles[L]?tlh:lh;
    }
  }
}
function fkey(){return showAll?'A':(focus>=0?'F'+focus:'-')}
function bump(){var k=fkey();if(k!==prevFocusKey){prevFocusKey=k;anim0=performance.now();animDir=(k!=='-');}}
function loop(){if(spin&&!drag)ry+=.0022;bump();draw();requestAnimationFrame(loop);}
function pick(mx,my){
  var best=-1,bz=-1e9;
  for(var i=0;i<N.length;i++){
    if(!vis(i))continue;
    var p=proj(wpos(i)),R=RAD[N[i].tier]*p.k;
    if(Math.hypot(p.x-mx,p.y-my)<=R&&p.z>bz){bz=p.z;best=i;}
  }
  return best;
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(i){
  var o=N[i];
  pt.innerHTML='<span class="dt" style="border-color:'+(o.tier===0?'var(--t0ring);background:var(--t0)':'var(--'+o.st+')')+'"></span>'+esc(o.label);
  pm.textContent=TIER[o.tier]+(o.tier?' · '+o.sub+' · '+ST[o.st]:'');
  pd.textContent=o.d;
  pc.innerHTML=(o.tech||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  panel.classList.add('on');
}
function setCrumb(){
  crumb.textContent=showAll?'전체 펼침 — 조각 40개. 휠로 확대해서 봐.'
    :(focus>=0?ring[focus].label+' 펼침 — 다른 큰 원을 누르면 그쪽으로, 처음으로 누르면 접힘'
              :'큰 원을 클릭하면 그 묶음이 펼쳐진다 · 끌어서 회전 · 휠로 확대');
}
cv.addEventListener('pointerdown',function(ev){
  drag=1;moved=0;lx=ev.clientX;ly=ev.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(ev.pointerId);
  if(spin){spin=0;document.getElementById('spinb').textContent='다시 회전';}
});
cv.addEventListener('pointermove',function(ev){
  var r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  if(drag){
    var dx=ev.clientX-lx,dy=ev.clientY-ly;
    moved+=Math.abs(dx)+Math.abs(dy);
    ry+=dx*.0065;rx=Math.max(-1.25,Math.min(1.25,rx+dy*.005));
    lx=ev.clientX;ly=ev.clientY;return;
  }
  var h=pick(mx,my);
  if(h!==hov){hov=h;cv.style.cursor=h>=0?'pointer':'grab';}
});
cv.addEventListener('pointerup',function(ev){
  drag=0;cv.style.cursor='grab';
  if(moved>=5)return;
  var r=cv.getBoundingClientRect(),h=pick(ev.clientX-r.left,ev.clientY-r.top);
  if(h<0){sel=-1;panel.classList.remove('on');return;}
  sel=h;show(h);
  var o=N[h];
  if(o.tier===1){showAll=0;focus=(focus===o.grp?-1:o.grp);setCrumb();}
  else if(o.tier===0){showAll=0;focus=-1;setCrumb();}
});
cv.addEventListener('pointerleave',function(){drag=0;hov=-1;});
cv.addEventListener('wheel',function(ev){ev.preventDefault();zoom=Math.max(.5,Math.min(2.6,zoom*(ev.deltaY<0?1.09:.917)));},{passive:false});
document.getElementById('techb').addEventListener('click',function(){showTech=showTech?0:1;this.classList.toggle('on',!!showTech);this.textContent=showTech?'기술 숨기기':'기술 보기';});
document.getElementById('allb').addEventListener('click',function(){showAll=showAll?0:1;focus=-1;this.textContent=showAll?'다시 접기':'전체 펼치기';setCrumb();});
document.getElementById('spinb').addEventListener('click',function(){spin=spin?0:1;this.textContent=spin?'회전 멈춤':'다시 회전';});
document.getElementById('resetb').addEventListener('click',function(){
  rx=-.62;ry=.40;zoom=1;sel=-1;focus=-1;showAll=0;
  document.getElementById('allb').textContent='전체 펼치기';
  panel.classList.remove('on');setCrumb();
});
document.getElementById('themeb').addEventListener('click',function(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  this.textContent=d?'어둡게':'밝게';readTheme();buildLegend();
});
if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){
  document.documentElement.setAttribute('data-theme','dark');
  document.getElementById('themeb').textContent='밝게';
}
function buildLegend(){
  var h='<span class="lg" style="color:var(--tx3)">면</span>'
      + '<span class="lg"><span class="dt" style="border-color:var(--t0ring);background:var(--t0)"></span>Her</span>';
  for(var i=0;i<ring.length;i++)
    h+='<span class="lg"><span class="dt" style="border-color:'+mix(PCOL[i],TH.sf,.35)+';background:'+mix(PCOL[i],TH.sf,.72)+'"></span>'+ring[i].label+'</span>';
  document.getElementById('plg').innerHTML=h;
}
window.addEventListener('resize',size);
readTheme();buildLegend();size();
(function(){var tb=document.getElementById('techb');if(showTech){tb.classList.add('on');tb.textContent='기술 숨기기';}})();
var t0=target();curC=[t0.c[0],t0.c[1],t0.c[2]];curS=t0.s;
loop();
})();
</script>
